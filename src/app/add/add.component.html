<div class="container mt-5">
    <h2>Add Two Numbers</h2>
    <div>
      <label>Number 1:</label>
      <input type="number" [(ngModel)]="num1" class="form-control" />
    </div>
    <div>
      <label>Number 2:</label>
      <input type="number" [(ngModel)]="num2" class="form-control" />
    </div>
    <div class="mt-3">
      <label>Result:</label>
      <input type="number" [value]="result" class="form-control" readonly />
    </div>
    <button class="btn btn-primary mt-3" (click)="calculateTotal()">Calculate</button>
  </div>
